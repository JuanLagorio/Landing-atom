<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#2b2a2a">
  <meta name="description" content="Clase gratis y en vivo de Atom. Dejá tus datos y asegurá tu cupo.">
  <meta property="og:title" content="Clase gratis | Atom">
  <meta property="og:description" content="Clase gratis y en vivo de Atom. Dejá tus datos y asegurá tu cupo.">
  <title>Clase gratis | Atom</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/estilos.css">
  <script src="config.js" defer></script>
  <script src="assets/embudo.js" defer></script>
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="icono-calendario" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M7 3v3m10-3v3M4 9h16M5 5h14a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1Z"/></symbol>
    <symbol id="icono-flecha" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" d="M5 12h14m-6-6 6 6-6 6"/></symbol>
    <symbol id="icono-candado" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M7 11V8a5 5 0 0 1 10 0v3M6 11h12a1 1 0 0 1 1 1v8a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1v-8a1 1 0 0 1 1-1Z"/></symbol>
  </svg>

  <main class="pagina">
    <img class="logo" src="assets/atom-logo.svg" alt="Atom" width="1181" height="685">

    <div class="progreso">
      <p class="progreso-texto"><span>Paso 1 de 2</span><span>50%</span></p>
      <div class="progreso-barra" role="progressbar" aria-label="Paso 1 de 2" aria-valuemin="0" aria-valuemax="100" aria-valuenow="50"><span style="--avance: 50%"></span></div>
    </div>

    <p class="etiqueta">Clase gratis y en vivo</p>
    <h1 data-titulo>Asegurá tu cupo para la próxima clase de Atom</h1>
    <p class="cuando" hidden>
      <span class="cuando-dia"><svg aria-hidden="true"><use href="#icono-calendario"/></svg><span data-fecha></span></span>
      <span class="cuenta" data-cuenta></span>
    </p>

    <form class="formulario" id="registro" novalidate>
      <div class="campo">
        <label class="sr-only" for="nombre">Tu nombre</label>
        <input id="nombre" name="nombre" type="text" placeholder="Tu nombre" autocomplete="given-name" autocapitalize="words" enterkeyhint="next" required aria-describedby="error-nombre">
        <p class="error" id="error-nombre"></p>
      </div>
      <div class="campo">
        <label class="sr-only" for="email">Tu email</label>
        <input id="email" name="email" type="email" placeholder="Tu email" autocomplete="email" inputmode="email" autocapitalize="off" spellcheck="false" enterkeyhint="next" required aria-describedby="error-email">
        <p class="error" id="error-email"></p>
        <button class="sugerencia" id="sugerencia-email" type="button" hidden></button>
      </div>
      <div class="campo">
        <label class="sr-only" for="telefono">Tu WhatsApp con código de área</label>
        <input id="telefono" name="telefono" type="tel" placeholder="Tu WhatsApp con código de área" autocomplete="tel" inputmode="tel" enterkeyhint="done" required aria-describedby="error-telefono">
        <p class="error" id="error-telefono"></p>
      </div>

      <button class="boton" type="submit">
        <span>Quiero asegurar mi cupo</span>
        <svg aria-hidden="true"><use href="#icono-flecha"/></svg>
      </button>
      <p class="nota"><svg aria-hidden="true"><use href="#icono-candado"/></svg>No compartimos tus datos con nadie.</p>
    </form>

    <p class="pie">© Atom Labs</p>
  </main>
</body>
</html>
